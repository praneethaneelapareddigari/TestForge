[metadata]
name = testforge
version = 0.1.0
description = Multi-Language Unit Test Generator and Reviewer
long_description = file: README.md
long_description_content_type = text/markdown
author = Praneetha
author_email = praneethaneelapareddigari@gmail.com
url = https://github.com/praneethaneelapareddigari/TestForge
license = MIT
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    Topic :: Software Development :: Testing
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10

[options]
packages = find:
python_requires = >=3.9
install_requires =
    typer
    jinja2
    pyyaml
    coverage
    mutmut
    probot

[options.entry_points]
console_scripts =
    testforge = testforge.cli:app

[tool:pytest]
addopts = -ra -q
testpaths =
    tests
    tests_generated

[coverage:run]
branch = True
source =
    testforge

[coverage:report]
show_missing = True
skip_covered = True
fail_under = 92

[flake8]
max-line-length = 100
exclude =
    .git,
    __pycache__,
    build,
    dist
