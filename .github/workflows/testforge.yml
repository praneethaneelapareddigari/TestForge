      - name: Debug import path
        shell: bash
        run: |
          python - <<'PY'
          import os, sys
          print("ENV PYTHONPATH =", os.environ.get("PYTHONPATH"))
          print("sys.path:\n", "\n".join(sys.path))
          def try_import(mod):
              try:
                  m = __import__(mod)
                  print(f"OK: {mod} ->", m.__file__)
              except Exception as e:
                  print(f"FAIL: {mod} ->", repr(e))
          try_import("module_a")
          try_import("sample_pkg")
          try:
              from sample_pkg import module_a as ma
              print("OK: sample_pkg.module_a ->", ma.__file__)
          except Exception as e:
              print("FAIL: sample_pkg.module_a ->", repr(e))
          PY
