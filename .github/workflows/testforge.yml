name: testforge

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Support BOTH import styles:
      #   from module_a import ...
      #   from sample_pkg.module_a import ...
      PYTHONPATH: ${{ github.workspace }}/examples:${{ github.workspace }}/examples/sample_pkg
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # If you added pyproject.toml later, this installs the package (optional)
          if [ -f examples/sample_pkg/pyproject.toml ]; then pip install -e examples/sample_pkg; fi
          pip install pytest

      - name: Show repo layout (debug)
        run: |
          echo "== TREE =="
          find . -maxdepth 4 -type f | sed 's|^\./||' | sort
          echo "== module_a candidates =="
          ls -l examples/sample_pkg/module_a.py || true
          ls -l examples/sample_pkg/sample_pkg/module_a.py || true

      - name: Debug import path
        shell: bash
        run: |
          python - <<'PY'
          import os, sys
          print("ENV PYTHONPATH =", os.environ.get("PYTHONPATH"))
          print("sys.path:\n", "\n".join(sys.path))
          def try_import(mod):
              try:
                  m = _import_(mod)
                  print(f"OK: {mod} ->", getattr(m, "_file_", "<pkg>"))
              except Exception as e:
                  print(f"FAIL: {mod} ->", repr(e))
          try_import("module_a")
          try_import("sample_pkg")
          try:
              import sample_pkg.module_a as ma
              print("OK: sample_pkg.module_a ->", ma._file_)
          except Exception as e:
              print("FAIL: sample_pkg.module_a ->", repr(e))
          PY

      - name: Run tests
        run: python -m pytest -vv -s examples/sample_pkg/tests_generated