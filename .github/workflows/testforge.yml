name: testforge

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Make module_a importable for the generated tests
      PYTHONPATH: ${{ github.workspace }}/examples/sample_pkg
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run tests
        shell: bash
        run: |
          # ensure the shell running pytest sees PYTHONPATH (defensive)
          export PYTHONPATH="${PYTHONPATH}"
          python -m pytest examples/sample_pkg/tests_generated -q
