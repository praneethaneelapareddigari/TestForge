name: testforge

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # install our sample package if using the packaged layout
          if [ -f examples/sample_pkg/pyproject.toml ]; then pip install -e examples/sample_pkg; fi
          pip install pytest

      - name: Run tests
        run: python -m pytest -q examples/sample_pkg/tests_generated